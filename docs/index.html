<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта объектов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<style>
:root{
  --bg:#f4f1ea;--surface:#fffdf8;--surface-2:#efeadf;--ink:#1d1b17;--muted:#7a7366;--line:#ddd5c5;
  --g-none:#2f9e5b;--g-part:#d99a1c;--g-full:#cf3b32;
  --c-factory:#d8692a;--c-other:#4b6fd6;--pin-ink:#fff;--star:#f2c230;--star-line:#8a6a08;
  --shadow:0 8px 28px rgba(40,30,10,.14);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15140f;--surface:#1f1d18;--surface-2:#2a2720;--ink:#f1ece1;--muted:#a59d8e;--line:#39352c;
  --g-none:#3dbb6f;--g-part:#e8ab2d;--g-full:#e5534a;--c-factory:#ec7a38;--c-other:#6b8bf0;
  --shadow:0 8px 28px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --bg:#15140f;--surface:#1f1d18;--surface-2:#2a2720;--ink:#f1ece1;--muted:#a59d8e;--line:#39352c;
  --g-none:#3dbb6f;--g-part:#e8ab2d;--g-full:#e5534a;--c-factory:#ec7a38;--c-other:#6b8bf0;
  --shadow:0 8px 28px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 Onest,system-ui,sans-serif}
.app{display:grid;grid-template-columns:340px 1fr;height:100vh;height:100dvh}
aside{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:2}
.head{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
h1{font:700 20px/1.15 Unbounded,sans-serif;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12.5px}
.filters{padding:12px 18px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);font:inherit}
.search:focus{outline:2px solid var(--c-other);outline-offset:-1px}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grp-l{font:500 10.5px/1 "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);width:100%;margin-bottom:1px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 12.5px/1 Onest,sans-serif;cursor:pointer;user-select:none}
.chip[aria-pressed="false"]{opacity:.42;text-decoration:line-through}
.chip svg{flex:none}
.count{font:500 11px/1 "JetBrains Mono",monospace;color:var(--muted)}
.list{overflow:auto;flex:1;min-height:0;padding:6px 8px 12px}
.row{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;cursor:pointer}
.row:hover,.row.on{background:var(--surface-2)}
.row b{font-weight:500;display:block}
.row small{color:var(--muted);font:11px/1.3 "JetBrains Mono",monospace}
.stars{color:var(--star);font-size:12px;letter-spacing:1px;white-space:nowrap}
.stars i{font-style:normal;color:var(--line)}
.empty{padding:20px;color:var(--muted);text-align:center}
#map{height:100%;background:var(--surface-2)}
.tools{position:absolute;top:12px;right:12px;z-index:500;display:flex;gap:6px}
.tbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 11px;font:500 12.5px/1 Onest,sans-serif;cursor:pointer;box-shadow:var(--shadow)}
.tbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.mapwrap{position:relative;min-height:0}
.legend{position:absolute;left:12px;bottom:22px;z-index:500;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);font-size:12px;display:grid;gap:5px}
.legend div{display:flex;align-items:center;gap:7px}
.leaflet-container{font:inherit}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.leaflet-popup-content{margin:12px 14px;min-width:220px}
.pop h3{font:600 15px/1.25 Onest,sans-serif;margin:0 0 6px}
.pop .tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.tag{font:500 11px/1 Onest;padding:4px 7px;border-radius:999px;color:#fff}
.pop .d{color:var(--ink);margin:0 0 8px;white-space:pre-line;max-height:160px;overflow:auto}
.pop .gal{display:flex;gap:6px;overflow-x:auto;margin:0 0 8px;padding-bottom:2px}
.pop .gal a,.pop .gal video{flex:none;width:96px;height:72px;border-radius:8px;overflow:hidden;background:var(--surface-2);display:block}
.pop .gal img,.pop .gal video{width:100%;height:100%;object-fit:cover;display:block}
.pop .ext{display:grid;gap:3px;margin:0 0 8px;font-size:12.5px}
.pop .ext a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi{font-size:11px;margin-left:4px}
.pop .c{font:12px/1 "JetBrains Mono",monospace;color:var(--muted);margin-bottom:8px;cursor:pointer}
.pop .pl{font-family:Onest;font-weight:500;color:var(--ink)}
.pop .lnk{display:flex;gap:10px}
.pop a{color:var(--c-other);font-weight:500}
.leaflet-control-zoom a,.leaflet-control-attribution{background:var(--surface)!important;color:var(--ink)!important}
.leaflet-control-attribution a{color:var(--muted)!important}
.mk{background:none;border:0}
.mk svg{overflow:visible;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.mk.hl svg{transform:scale(1.25);transform-origin:50% 100%}
.far .mk .st{display:none}
.cl{background:none;border:0}
.cl div{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:700 13px/1 Unbounded;color:#fff;border:3px solid var(--surface);box-shadow:var(--shadow);background:conic-gradient(var(--c-factory) 0 var(--p),var(--c-other) var(--p) 100%)}
.cl span{background:rgba(0,0,0,.35);border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
.toggle{display:none}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr}
  aside{position:fixed;inset:auto 0 0 0;height:62dvh;transform:translateY(calc(100% - 64px));transition:transform .25s;border-right:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:var(--shadow)}
  aside.open{transform:none}
  .toggle{display:block;width:100%;border:0;background:none;color:var(--muted);padding:6px 0 0;font:500 12px Onest;cursor:pointer}
  .head{padding:8px 16px 10px}
  .filters,.list{padding-left:16px;padding-right:16px}
  .legend{display:none}
  .mapwrap{height:100dvh}
}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <button class="toggle" id="tg" aria-label="Показать список">▲ список</button>
    <div class="head">
      <h1>Карта объектов</h1>
      <div class="sub"><span id="shown">0</span> из <span id="total">0</span> на карте</div>
    </div>
    <div class="filters">
      <input class="search" id="q" type="search" placeholder="Найти по названию…" autocomplete="off">
      <div class="grp" id="f-cls"><span class="grp-l">Класс</span></div>
      <div class="grp" id="f-sec"><span class="grp-l">Охрана</span></div>
      <div class="grp" id="f-int"><span class="grp-l">Интересность</span></div>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <div class="mapwrap">
    <div id="map"></div>
    <div class="tools">
      <button class="tbtn" id="b-map" aria-pressed="true">Схема</button>
      <button class="tbtn" id="b-sat" aria-pressed="false">Спутник</button>
      <button class="tbtn" id="b-all" title="Показать все объекты">⤢</button>
    </div>
    <div class="legend" id="legend"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script>
/* ===== ДАННЫЕ =====
   Формат строки: название | широта | долгота | класс | охрана | интерес | описание
   класс:  F — Заводы, O — Постройки
   охрана: 0 — нет, 1 — незначительная, 2 — полная, 3 — неизвестно
   интерес: 1–3 звезды, 0 — ещё не оценено
   Охрана пока черновая: красная метка в Earth → 0, жёлтая → 1, «охрана» в названии → 2. */
const DATA=`
Заброшенный карьер с техникой|56 58 25.61|60 22 35.32|O|0|3|
Дидинский тоннель|56 49 07.21|59 41 48.46|O|0|3|
Недостроенное депо|56 47 48.09|59 30 11.16|F|3|3|
Заброшенная база отдыха|56 51 45.33|60 41 20.61|O|3|3|
Заброшенная котельная|56 51 55.33|60 43 53.41|O|0|3|
Закрытый элеватор|56 43 42.15|60 44 41.15|F|2|3|
Закрытый элеватор|56 47 36.30|60 44 07.26|F|1|3|
Заброшенная котельная|56 47 36.09|60 44 21.62|F|2|3|
Закрытый завод|56 52 59.66|60 36 24.82|F|2|3|
Заброшенный цех|56 52 52.36|60 36 31.22|F|2|3|
Заброшенные цеха|57 29 29.59|60 13 31.83|F|1|2|
Истокская легенда|56 47 44.44|60 53 47.55|O|1|2|
ШТК|56 37 50.21|60 36 11.86|F|0|2|
Низкие опоры радиоцентра|56 55 39.94|60 35 42.10|O|1|3|
Закрытый цех|56 54 23.44|59 52 43.83|F|2|3|
Закрытые цеха|56 46 47.05|60 37 18.99|F|2|3|
Разрушенный недостроенный санаторий|56 38 14.82|61 00 29.72|O|0|1|
Старая линза (легально)|56 37 33.52|60 36 21.04|O|0|2|
Закрытая гостиница (охрана)|56 51 59.97|60 41 18.09|O|2|3|
Заброшенная вышка освещения|56 46 21.06|60 38 42.87|O|1|3|
Закрытая котельная|56 52 48.11|60 38 23.79|F|2|1|
Закрытый цех|56 52 36.29|60 36 01.51|F|2|2|
Заброшенные цеха|56 52 56.34|60 36 07.79|F|2|3|
Призма|56 51 23.43|60 35 51.40|O|2|3|
Закрытый завод|56 53 04.13|60 39 15.65|F|2|3|
Недострой|56 46 15.12|60 47 46.94|O|3|2|
Охраняемый недострой|56 58 24.77|60 21 56.03|F|2|1|
Охраняемый закрытый цех|56 58 20.88|60 21 43.74|F|2|1|
Охраняемая башня|56 58 22.34|60 21 54.84|F|2|2|
Щебёночный завод (Росгвардия)|56 58 29.65|60 21 48.95|F|2|3|
Паркинг+здание|56 49 02.50|60 39 59.78|O|2|2|
Недостроенные пентхаусы|56 51 56.19|60 43 48.48|O|1|1|
Горнолыжные трамплины (и похожая инфраструктура)|56 46 20.43|60 38 31.62|O|1|1|
Высотные вышки радиоцентра|56 55 35.15|60 36 23.79|O|1|3|
Крайне интересное место|56 50 43.51|60 36 39.68|O|3|3|
Дырка в земле|56 48 22.59|60 42 33.07|O|0|1|
Закрытая промзона под снос|56 52 37.64|60 35 05.78|F|2|3|
Аэропорт Адуй|57 06 23.10|60 36 26.37|O|0|1|
Расформированная воинская часть|56 43 54.01|60 56 18.47|O|0|1|
Бомбоубежище|56 50 57.68|60 36 15.83|O|3|2|
Завод изоляторов|56 51 04.07|62 42 56.29|F|3|3|
Гостиница Исеть|56 50 26.43|60 37 15.13|O|3|3|
Интересная вышка|56 31 40.26|60 54 13.37|O|3|3|
Вышка связи|56 44 04.68|61 03 43.62|O|3|3|
Закрытый лакокрасочный цех|56 41 10.70|60 58 27.50|F|2|2|Всё интересное вынесено
Заброшенная котельная|56 41 13.14|60 58 26.71|F|2|2|Внутри мало что осталось
Труба на охраняемой территории|56 41 13.62|60 58 27.21|F|2|1|
Заброшенная лаборатория|56 54 21.57|59 52 46.20|F|2|2|
Режникель|57 22 21.01|61 24 10.36|F|2|3|
Возможно закрытый завод|57 02 14.75|61 32 13.01|F|2|3|
Как минимум парковка пустая|56 53 51.11|59 58 32.75|F|2|3|
Закрытый цех|57 40 03.42|63 05 38.47|F|2|3|
Группа заброшенных цехов|57 49 48.50|61 41 11.08|F|1|2|
Закрытый цех|56 22 00.96|61 57 22.80|F|1|3|
Закрытый цех|56 52 55.10|60 36 10.84|F|2|3|
Закрытый цех|56 52 46.89|60 36 23.52|F|2|3|
Заводоуправление с музеем и бомбоубежищем|57 55 06.83|60 03 04.12|F|1|3|
Возможно закрытый цех|57 29 34.97|60 13 35.85|F|1|2|
Заброшенный кран|56 56 08.11|60 36 28.02|F|3|3|
Заброшенный цех|57 39 49.55|63 05 52.30|F|0|2|
ДК Химмаш|56 45 13.85|60 41 38.75|O|2|3|
`;

const CLS={F:{name:'Заводы',color:'var(--c-factory)'},O:{name:'Постройки',color:'var(--c-other)'}};
const SEC=[{name:'Нет охраны',color:'var(--g-none)'},{name:'Незначительная',color:'var(--g-part)'},{name:'Полная',color:'var(--g-full)'},{name:'Неизвестно',color:'var(--muted)'}];
const INT=[{name:'Не оценено'},{name:'★'},{name:'★★'},{name:'★★★'}];

const PLACES=["Исеть","ГО Первоуральск","Дружинино","Екатеринбург","Екатеринбург","Большой Исток","Екатеринбург","Екатеринбург","Екатеринбург","Екатеринбург","Невьянск","Екатеринбург","Екатеринбург","Екатеринбург","Первоуральск","Екатеринбург","Колос","Екатеринбург","Екатеринбург","Екатеринбург","Екатеринбург","Екатеринбург","Екатеринбург","Екатеринбург","Екатеринбург","Екатеринбург","Исеть","Исеть","Исеть","Исеть","Екатеринбург","Екатеринбург","Екатеринбург","Екатеринбург","Екатеринбург","Екатеринбург","Екатеринбург","Нагорный","Прохладный","Екатеринбург","Камышлов","Екатеринбург","Сысертский округ","Белоярский округ","Бобровский","Бобровский","Бобровский","Первоуральск","Реж","Асбест","Первоуральск","Ирбит","Алапаевск","Каменск-Уральский","Екатеринбург","Екатеринбург","Нижний Тагил","Невьянск","Екатеринбург","Ирбит","Екатеринбург"];
/* ===== ОПИСАНИЯ, ФОТО, ВИДЕО, ССЫЛКИ =====
   Ключ — номер объекта (как в списке DATA, с 1). Файлы лежат в docs/media/. */
const EXTRA={};
const dms=s=>{const[d,m,x]=s.trim().split(/\s+/).map(Number);return d+m/60+x/3600};
const pts=DATA.trim().split('\n').map((l,i)=>{const[n,la,lo,c,g,k,desc]=l.split('|');
  const x=EXTRA[i+1]||{};return{id:i,name:n,place:PLACES[i],media:x.media||[],links:x.links||[],lat:dms(la),lon:dms(lo),c,g:+g,k:+k,desc:(x.desc??desc??'').trim(),dla:la,dlo:lo}});

/* ===== ЗНАЧКИ (вариант «Щит») ===== */
/* Вышки и опоры (по слову в названии) рисуются значком вышки вместо завода/здания */
const isTower=n=>/(^|\s)(вышк|опор)/i.test(n);
const TOWER='<g fill="none" stroke="var(--pin-ink)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M0-5.2v-1.6M-1.3-5L-3.8 6M1.3-5L3.8 6M-1.3-5h2.6M-2.1-1.4h4.2M-3 2.4h6M-2.1-1.4L3 2.4M2.1-1.4L-3 2.4"/></g><circle cy="-7" r="1.1" fill="var(--pin-ink)"/>';
const glyph=(c,t)=>t?TOWER:c==='F'
  ?'<path d="M-6 5V-1l3.5-2.5V-1l3.5-2.5V-1L4.5-3.6V-6h1.5v11z" fill="var(--pin-ink)"/>'
  :'<path d="M-5.5 5V-1.5L0-5.5l5.5 4V5H2V1h-4v4z" fill="var(--pin-ink)"/>';
const starPath=r=>{let d='';for(let j=0;j<10;j++){const a=-Math.PI/2+j*Math.PI/5,q=j%2?r*.45:r;d+=(j?'L':'M')+(q*Math.cos(a)).toFixed(2)+' '+(q*Math.sin(a)).toFixed(2)}return d+'z'};
const STAR=starPath(4.6);
const SH='M0-6l6 2.2v3.3C6 3 3.4 5.5 0 6.6-3.4 5.5-6 3-6-.5v-3.3z';
function badge(g){
  if(g===3)return`<circle r="6" fill="${SEC[3].color}" stroke="var(--surface)" stroke-width="1.5"/><text y="3" text-anchor="middle" font-size="8.5" font-weight="700" font-family="Onest,sans-serif" fill="#fff">?</text>`;
  if(g===0)return`<circle r="6" fill="${SEC[0].color}" stroke="var(--surface)" stroke-width="1.5"/>`;
  if(g===1)return`<path d="${SH}" fill="var(--surface)" stroke="${SEC[1].color}" stroke-width="2"/><path d="M0-6l6 2.2v3.3C6 3 3.4 5.5 0 6.6z" fill="${SEC[1].color}"/>`;
  return`<g transform="scale(1.15)"><path d="${SH}" fill="${SEC[2].color}" stroke="var(--surface)" stroke-width="1.5"/></g>`;
}
function stars(k){let s='';for(let j=0;j<3;j++){const on=j<k;
  s+=`<path transform="translate(${(j-1)*10.5},-42)" d="${STAR}" fill="${on?'var(--star)':'var(--surface)'}" stroke="${on?'var(--star-line)':'var(--muted)'}" stroke-width="1" stroke-linejoin="round"/>`}
  return`<g class="st">${s}</g>`}
function markerSVG(c,g,k,t){
  return`<svg width="40" height="56" viewBox="-20 -50 40 56">${stars(k)}
  <path d="M0 0C-4-7-13-11-13-19a13 13 0 0 1 26 0C13-11 4-7 0 0z" fill="${CLS[c].color}" stroke="var(--surface)" stroke-width="2"/>
  <g transform="translate(0,-19)">${glyph(c,t)}</g><g transform="translate(11,-29)">${badge(g)}</g></svg>`}
const mini=svg=>`<svg width="18" height="18" viewBox="-9 -9 18 18">${svg}</svg>`;
const clsDot=c=>mini(`<circle r="8" fill="${CLS[c].color}"/><g transform="scale(.8)">${glyph(c)}</g>`);
const secIco=g=>mini(`<g transform="scale(1.2)">${badge(g)}</g>`);
const starTxt=k=>k?`<span class="stars">${'★'.repeat(k)}<i>${'★'.repeat(3-k)}</i></span>`:`<span class="stars"><i>★★★</i></span>`;

/* ===== КАРТА ===== */
const map=L.map('map',{zoomControl:true,attributionControl:true}).setView([56.85,60.6],9);
const base={
  map:L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}),
  sat:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'})
};
base.map.addTo(map);

map.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
function setBase(k){Object.entries(base).forEach(([n,l])=>{if(n===k)l.addTo(map);else map.removeLayer(l)});
  document.getElementById('b-map').setAttribute('aria-pressed',k==='map');document.getElementById('b-sat').setAttribute('aria-pressed',k==='sat')}
document.getElementById('b-map').onclick=()=>setBase('map');
document.getElementById('b-sat').onclick=()=>setBase('sat');

const cluster=L.markerClusterGroup({animate:false,maxClusterRadius:42,disableClusteringAtZoom:14,showCoverageOnHover:false,
  iconCreateFunction:cl=>{const ms=cl.getAllChildMarkers(),f=ms.filter(m=>m.p.c==='F').length;
    return L.divIcon({className:'cl',iconSize:[38,38],html:`<div style="--p:${Math.round(f/ms.length*100)}%"><span>${ms.length}</span></div>`})}});
map.addLayer(cluster);

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const coordTxt=p=>`${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}`;
function popup(p){
  return`<div class="pop"><h3>${p.name}</h3><div class="tags">
  <span class="tag" style="background:${CLS[p.c].color}">${CLS[p.c].name}</span>
  <span class="tag" style="background:${SEC[p.g].color}">${SEC[p.g].name}</span>
  <span class="tag" style="background:var(--muted)">${p.k?'★'.repeat(p.k):'интерес не оценён'}</span></div>
  ${p.desc?`<p class="d">${esc(p.desc)}</p>`:''}
  ${p.media.length?`<div class="gal">${p.media.map(m=>/\.(mp4|webm)$/i.test(m)?`<video src="${m}" controls preload="metadata"></video>`:`<a href="${m}" target="_blank" rel="noopener"><img src="${m}" alt="" loading="lazy"></a>`).join('')}</div>`:''}
  ${p.links.length?`<div class="ext">${p.links.map(u=>`<a target="_blank" rel="noopener" href="${esc(u)}">${esc(u.replace(/^https?:\/\/(www\.)?/,''))}</a>`).join('')}</div>`:''}
  <div class="c" title="Нажмите, чтобы скопировать" onclick="navigator.clipboard&&navigator.clipboard.writeText('${coordTxt(p)}');this.textContent='скопировано ✓'"><span class="pl">${p.place}</span> · ${coordTxt(p)}</div>
  <div class="lnk"><a target="_blank" rel="noopener" href="https://yandex.ru/maps/?pt=${p.lon},${p.lat}&z=17&l=map">Яндекс</a>
  <a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lon}">Google</a></div></div>`}

pts.forEach(p=>{
  p.m=L.marker([p.lat,p.lon],{icon:L.divIcon({className:'mk',html:markerSVG(p.c,p.g,p.k,isTower(p.name)),iconSize:[40,56],iconAnchor:[20,50],popupAnchor:[0,-40]}),title:p.name});
  p.m.p=p;p.m.bindPopup(popup(p),{maxWidth:330});
  p.m.on('popupopen',()=>mark(p.id));
});
const zoomCls=()=>map.getContainer().classList.toggle('far',map.getZoom()<12);
map.on('zoomend',zoomCls);zoomCls();

/* ===== ФИЛЬТРЫ ===== */
const st={c:new Set(['F','O']),g:new Set([0,1,2,3]),k:new Set([0,1,2,3]),q:''};
function chip(box,label,ico,key,val){
  const b=document.createElement('button');b.className='chip';b.setAttribute('aria-pressed','true');
  b.innerHTML=`${ico}${label}<span class="count" data-k="${key}" data-v="${val}"></span>`;
  b.onclick=()=>{const s=st[key];s.has(val)?s.delete(val):s.add(val);b.setAttribute('aria-pressed',s.has(val));render()};
  document.getElementById(box).appendChild(b)}
Object.keys(CLS).forEach(c=>chip('f-cls',CLS[c].name,clsDot(c),'c',c));
SEC.forEach((s,g)=>chip('f-sec',s.name,secIco(g),'g',g));
[1,2,3,0].forEach(k=>chip('f-int',k?'★'.repeat(k):'Не оценено','','k',k));
document.getElementById('q').oninput=e=>{st.q=e.target.value.trim().toLowerCase();render()};

document.getElementById('legend').innerHTML=
  Object.keys(CLS).map(c=>`<div>${clsDot(c)}${CLS[c].name}</div>`).join('')+
  SEC.map((s,g)=>`<div>${secIco(g)}${s.name}</div>`).join('')+
  `<div><span class="stars">★★★</span>интересность</div>`;

const list=document.getElementById('list');
let shown=[];
function render(){
  shown=pts.filter(p=>st.c.has(p.c)&&st.g.has(p.g)&&st.k.has(p.k)&&(!st.q||(p.name+" "+p.place).toLowerCase().includes(st.q)));
  cluster.clearLayers();cluster.addLayers(shown.map(p=>p.m));
  document.getElementById('shown').textContent=shown.length;
  document.getElementById('total').textContent=pts.length;
  document.querySelectorAll('.count').forEach(el=>{const k=el.dataset.k,v=k==='c'?el.dataset.v:+el.dataset.v;
    el.textContent=pts.filter(p=>p[k]===v).length});
  const sorted=[...shown].sort((a,b)=>b.k-a.k||b.g-a.g||a.name.localeCompare(b.name,'ru'));
  list.innerHTML=sorted.length?sorted.map(p=>`<div class="row" data-id="${p.id}">
    <svg width="30" height="36" viewBox="-15 -36 30 38"><g transform="scale(.75)">${markerSVG(p.c,p.g,0,isTower(p.name)).replace(/<svg[^>]*>|<\/svg>/g,'').replace(/<g class="st">[\s\S]*?<\/g>/,'')}</g></svg>
    <div><b>${p.name}${p.media.length?'<span class="mi" title="Есть фото/видео">📷</span>':''}</b><small>${p.place} · ${CLS[p.c].name} · ${SEC[p.g].name.toLowerCase()}</small></div>${starTxt(p.k)}</div>`).join('')
    :'<div class="empty">Ничего не найдено — ослабьте фильтры</div>';
}
list.onclick=e=>{const r=e.target.closest('.row');if(!r)return;const p=pts[+r.dataset.id];
  cluster.zoomToShowLayer(p.m,()=>p.m.openPopup());
  if(innerWidth<=760)side.classList.remove('open')};
function mark(id){list.querySelectorAll('.row').forEach(r=>r.classList.toggle('on',+r.dataset.id===id));
  const r=list.querySelector(`.row[data-id="${id}"]`);r&&r.scrollIntoView({block:'nearest'})}
function fitAll(){if(shown.length)map.fitBounds(L.latLngBounds(shown.map(p=>[p.lat,p.lon])),{padding:[40,40]})}
document.getElementById('b-all').onclick=fitAll;
const side=document.getElementById('side');
document.getElementById('tg').onclick=()=>{side.classList.toggle('open');tg.textContent=side.classList.contains('open')?'▼ скрыть':'▲ список'};
render();fitAll();
</script>
</body>
</html>
